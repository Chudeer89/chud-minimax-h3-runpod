name: Build ChuD MiniMax H3 v2.3 One-Click

on:
  workflow_dispatch:
  push:
    branches:
      - h3-v2.3

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scripts and workflow snapshot
        run: |
          bash -n install-nodes.sh
          bash -n docker-start.sh
          bash -n restore-v21.sh
          bash -n audit-v21.sh
          bash -n assemble-workflow.sh
          python3 -m py_compile download-models.py
          bash assemble-workflow.sh workflows/chunks /tmp/minimaxH3SEEDHUNTERLatent_v21.json
          python3 -m json.tool /tmp/minimaxH3SEEDHUNTERLatent_v21.json >/dev/null

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/chudeer89/chud-minimax-h3-runpod:v23
            ghcr.io/chudeer89/chud-minimax-h3-runpod:v23-${{ github.sha }}
