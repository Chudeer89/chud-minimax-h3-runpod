name: Build ChuD MiniMax H3 v2.4 Modular

on:
  workflow_dispatch:
  push:
    branches:
      - h3-v2.4

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official Seed Hunter v2.5 workflow
        run: |
          mkdir -p workflows
          curl -L --fail --retry 4 --retry-delay 3 -A "Mozilla/5.0 ChuD-v24-build" "https://civitai.com/api/download/models/3383710" -o workflows/minimaxH3SEEDHUNTERLatent_v25.json
          python3 -m json.tool workflows/minimaxH3SEEDHUNTERLatent_v25.json >/dev/null
          python3 validate-v25-workflow.py

      - name: Validate v2.4
        run: |
          bash -n install-nodes.sh
          bash -n docker-start.sh
          bash -n v24-module-manager.sh
          bash -n setup-thai-tts.sh
          bash -n restore-v21.sh
          bash -n audit-v21.sh
          bash -n assemble-workflow.sh
          python3 -m py_compile download-models.py thai_tts_server.py custom_nodes/ChuD-ThaiTTS/nodes.py validate-v25-workflow.py
          bash assemble-workflow.sh workflows/chunks /tmp/minimaxH3SEEDHUNTERLatent_v21.json
          python3 -m json.tool /tmp/minimaxH3SEEDHUNTERLatent_v21.json >/dev/null

      - name: Test Windows-style LoRA aliases
        run: |
          T=$(mktemp -d)
          mkdir -p "$T/models/loras/MINIMAX/Turbo"
          echo x > "$T/models/loras/MINIMAX/minimax_h3_DMAD_4step_full_lora_avg_rank_39_bf16.safetensors"
          echo x > "$T/models/loras/MINIMAX/Turbo/t.safetensors"
          echo x > "$T/models/loras/root.safetensors"
          sed -n '/^LORAS=/,/Windows-style backslash/p' docker-start.sh > /tmp/alias.sh
          test -s /tmp/alias.sh
          COMFY="$T" bash -euo pipefail -c 'source /tmp/alias.sh; source /tmp/alias.sh'
          ls -la "$T/models/loras"
          python3 - "$T/models/loras" <<'PY'
          import os, sys
          base = sys.argv[1]
          bs = chr(92)  # backslash, as saved by ComfyUI on Windows
          rels = ["MINIMAX/minimax_h3_DMAD_4step_full_lora_avg_rank_39_bf16.safetensors",
                  "MINIMAX/Turbo/t.safetensors", "root.safetensors"]
          for name in rels + [r.replace("/", bs) for r in rels]:
              # same resolution as ComfyUI folder_paths.get_full_path
              p = os.path.join(base, os.path.relpath(os.path.join("/", name), "/"))
              assert os.path.isfile(p), p
              print("OK", name)
          PY

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/chudeer89/chud-minimax-h3-runpod:v24
            ghcr.io/chudeer89/chud-minimax-h3-runpod:v24-${{ github.sha }}
