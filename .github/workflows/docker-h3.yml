name: Build ChuD MiniMax H3 v2.4 Modular

on:
  workflow_dispatch:
  push:
    branches:
      - h3-v2.4

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official Seed Hunter v2.5 workflow
        run: |
          mkdir -p workflows
          curl -L --fail --retry 4 --retry-delay 3             -A "Mozilla/5.0 ChuD-v24-build"             "https://civitai.com/api/download/models/3383710"             -o workflows/minimaxH3SEEDHUNTERLatent_v25.json
          python3 -m json.tool workflows/minimaxH3SEEDHUNTERLatent_v25.json >/dev/null
          python3 - <<'PY'
import json, hashlib, pathlib, sys
p = pathlib.Path("workflows/minimaxH3SEEDHUNTERLatent_v25.json")
data = json.loads(p.read_text(encoding="utf-8"))
nodes = data.get("nodes") or []
if len(nodes) < 400:
    raise SystemExit(f"Seed Hunter v2.5 validation failed: only {len(nodes)} nodes")
types = {str(n.get("type","")) for n in nodes}
required = {"VHS_VideoCombine", "MiniMaxH3AddGuide"}
missing = required - types
if missing:
    raise SystemExit("Seed Hunter v2.5 validation failed: missing node types " + ", ".join(sorted(missing)))
model_names = []
for n in nodes:
    vals = n.get("widgets_values")
    if isinstance(vals, list):
        model_names.extend(str(v) for v in vals if isinstance(v, str))
joined = "\n".join(model_names)
if "Minimax-h3_Singularity_ref2va_Pruned_v1.3_int8.safetensors" not in joined:
    raise SystemExit("Seed Hunter v2.5 validation failed: expected Singularity v1.3 Pruned model selector not found")
print("Seed Hunter v2.5 JSON validation: OK")
print("nodes:", len(nodes))
print("sha256:", hashlib.sha256(p.read_bytes()).hexdigest())
PY

      - name: Validate v2.4
        run: |
          bash -n install-nodes.sh
          bash -n docker-start.sh
          bash -n v24-module-manager.sh
          bash -n setup-thai-tts.sh
          bash -n restore-v21.sh
          bash -n audit-v21.sh
          bash -n assemble-workflow.sh
          python3 -m py_compile download-models.py thai_tts_server.py custom_nodes/ChuD-ThaiTTS/nodes.py
          bash assemble-workflow.sh workflows/chunks /tmp/minimaxH3SEEDHUNTERLatent_v21.json
          python3 -m json.tool /tmp/minimaxH3SEEDHUNTERLatent_v21.json >/dev/null

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/chudeer89/chud-minimax-h3-runpod:v24
            ghcr.io/chudeer89/chud-minimax-h3-runpod:v24-${{ github.sha }}
